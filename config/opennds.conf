# openNDS generic-Linux test configuration.
# The GatewayInterface must be the WiHotspot client/AP interface, not the WAN.
GatewayName Paid-WiFi-Test
GatewayInterface ap0
GatewayAddress 192.168.12.1
GatewayPort 2050
login_option_enabled 1
sessiontimeout 60
preauthidletimeout 10
authidletimeout 120
checkinterval 30

# Keep local DHCP, DNS and administration reachable from the hotspot.
FirewallRuleSet users-to-router {
    FirewallRule allow udp port 53
    FirewallRule allow tcp port 53
    FirewallRule allow udp port 5353
    FirewallRule allow tcp port 5353
    FirewallRule allow udp port 67
    FirewallRule allow tcp port 22
    FirewallRule allow tcp port 80
    FirewallRule allow tcp port 443
}

# Allow Android's pre-authentication probe to reach the Tailscale Funnel node.
FirewallRule allow tcp port 443 to 100.85.186.27
FirewallRule allow tcp port 443 to 176.58.90.46
FirewallRule allow tcp port 443 to 176.58.90.63
FirewallRule allow tcp port 443 to 176.58.90.145
